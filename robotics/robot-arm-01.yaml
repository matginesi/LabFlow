schema: labflow.robot.v1
id: robot-arm-01
name: Robot Arm 01
description: Three-joint laboratory robot arm demonstration
mode: simulation
controller: simulation
hardware_configured: false
links:
  base_height_mm: 145
  link_1_mm: 260
  link_2_mm: 220
  tool_length_mm: 72
joints:
  - id: j1
    name: Base
    type: revolute
    min_deg: -160
    max_deg: 160
    home_deg: 0
  - id: j2
    name: Shoulder
    type: revolute
    min_deg: -25
    max_deg: 120
    home_deg: 55
  - id: j3
    name: Elbow
    type: revolute
    min_deg: -125
    max_deg: 125
    home_deg: -70
poses:
  - name: HOME
    joints: {j1: 0, j2: 55, j3: -70}
  - name: PICK
    joints: {j1: -35, j2: 18, j3: -55}
  - name: INSPECT
    joints: {j1: 10, j2: 45, j3: -30}
  - name: DROP
    joints: {j1: 35, j2: 22, j3: -60}
programs:
  - id: sample-inspection
    name: Sample inspection
    speed: 0.65
    sequence:
      - {pose: HOME, wait_ms: 250}
      - {pose: PICK, duration_ms: 1000}
      - {gripper: close, wait_ms: 350}
      - {pose: INSPECT, duration_ms: 1150}
      - {wait_ms: 1200}
      - {pose: DROP, duration_ms: 1000}
      - {gripper: open, wait_ms: 300}
      - {pose: HOME, duration_ms: 900}
  - id: calibration-sweep
    name: Calibration sweep
    speed: 0.45
    sequence:
      - {pose: HOME, wait_ms: 250}
      - {joints: {j1: -70, j2: 35, j3: -25}, duration_ms: 900}
      - {joints: {j1: 70, j2: 35, j3: -25}, duration_ms: 1400}
      - {pose: HOME, duration_ms: 900}
integration:
  workspace: Advanced Photovoltaics
  experiment: PRJ-2026-014
  sample: SAMPLE-08
  process_step: Visual inspection
  operation: Visual inspection with robotic arm
