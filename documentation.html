<script id="doc-overview" type="text/markdown">
# LabFlow Researcher Workspace

## Purpose

LabFlow is a static interface POC for testing one credible path between a perovskite laboratory experiment and NOMAD. It helps researchers organise shared resources, concrete experimental work, evidence, analysis and outputs without exposing repository-oriented complexity.

## Product scope

```graph
direction LR
Workspace[Laboratory workspace] --> Project[Project]
Project --> Experiment[Experiment]
Cabinet[Shared Lab Cabinet] --> Experiment
Experiment --> Evidence[Data and results]
Knowledge[Shared knowledge] --> Researcher[Researcher review]
Evidence --> Output[Report and export]
Output --> NOMAD[NOMAD]
```

The POC deliberately offers one standard experimental workflow. It does not present invented experiment categories. Additional workflows should follow only after testing this path with researchers.

## Core principles

- start from the researcher’s next task;
- prepare solutions before defining stacks;
- reuse shared definitions but preserve experiment-owned snapshots;
- separate protocol from actual execution;
- show essential fields before advanced details;
- keep the workflow editable and non-blocking;
- show provenance, exclusions and warnings;
- keep NOMAD last;
- never present simulated AI output as verified truth.

## Static boundary

The interface has no backend, authentication, shared persistence, database, file storage, real AI service, embeddings, vector database or NOMAD network integration. These behaviours are explicitly simulated where shown.

<script id="doc-workflows" type="text/markdown">
# Standard researcher workflow

`Solutions → Stacks → Processing → Data → Analysis → Charts & report → Export → NOMAD`

The experiment home always shows the full path, phase state and one recommended next action. Researchers may save, skip optional work or revisit a phase.

## 1. Solutions

Select one solvent or mixture, add solutes and optional additives, enter concentration and volume, describe preparation, then distinguish the reusable recipe from the concrete batch.

## 2. Stacks

Create one stack, similar stacks or simple variants. Record ordered layers, materials, substrate, dimensions, thicknesses, solution usage, instruments, conditions, notes and sample count.

## 3. Processing

Select the reusable protocol and record what was actually performed. Spin coating and annealing show only their relevant parameters. Actual values, timestamps, deviations and evidence belong to the run.

## 4. Data

Upload a common file, enter a table/value/series manually, import, or add later. Associate data with the whole experiment, one or more stacks, a process action, measurement or result.

## 5. Analysis

Compare stacks, explore linked data, create a chart, use a local tool or request optional evidence-linked AI analysis. Keep anomalies and missing data visible.

## 6. Charts and report

Choose stacks and measurements, edit titles and units, save visualisations and build an editable report from experiment records and provenance.

## 7. Export

Generate CSV, Excel, JSON, JSONL, images, PDF, ZIP or a full archive. Review included and excluded content, version and warnings first.

## 8. NOMAD

Check completeness, units, resources, stacks, processing, instruments, data, files, identifiers, provenance and mapping. Then explicitly export a package or simulate API submission. Nothing is sent automatically.
</script>

<script id="doc-data" type="text/markdown">
# Scientific records

## Shared definition versus concrete use

| Shared Lab Cabinet record | Experiment-owned evidence |
|---|---|
| Solution recipe | Prepared solution batch |
| Stack template | Experiment stack |
| Protocol / pipeline | Process run |
| Reusable action | Executed action |
| Instrument | Instrument use and actual settings |
| Material / substance | Lot or recorded use |

A usage snapshot preserves the referenced version, affected stacks, amount and unit, actual parameters, operator and time. Later edits to shared definitions must not rewrite history.

## Experiment graph

```graph
direction LR
Recipe[Solution recipe] --> Batch[Prepared batch]
Batch --> Stack[Experiment stack]
Protocol[Protocol] --> Run[Process run]
Stack --> Run
Run --> Sample[Samples]
Sample --> Measurement[Measurements]
Measurement --> File[Original files]
Measurement --> Result[Derived results]
Result --> Report[Report]
Report --> Export[Export package]
```

## Evidence rules

- Original files are evidence, not derived results.
- Measurements add acquisition context.
- Results reference their files, method/version and validation state.
- Reports reference records rather than copying unexplained values.
- Export packages record scope, inclusions, exclusions, warnings and versions.
- AI outputs remain separate drafts and never overwrite originals.
</script>

<script id="doc-ui" type="text/markdown">
# UI guide

## Interaction hierarchy

Each workflow phase has one primary action. Secondary actions support inspection or optional work. Advanced scientific fields remain expandable.

## Canonical patterns

- eight-phase workflow rail with completed, current, to-do, optional and verify states;
- next-action strip with one sentence and one control;
- compact panels, low radii and information-bearing borders;
- solution flow from solvent mixture to concrete batch;
- visual ordered stack layers;
- reusable protocol beside actual run;
- contained data tables and explicit targets;
- evidence citations with provenance and warnings;
- included/excluded review before export;
- confirmation before contextual knowledge actions.

## Responsive rules

Support 360–1440 px. Below 980 px the sidebar becomes a drawer. Workflow rails scroll horizontally. Tables stay in contained scrollers. Scientific grids collapse to one column without hiding context or primary actions.

## Language

Use laboratory terms recognised by researchers. Do not expose implementation concepts as tasks and do not ask users to select an unvalidated experiment category.
</script>

<script id="doc-ai" type="text/markdown">
# AI, Knowledge Chat and Agents

## Three separate tools

| Tool | Purpose |
|---|---|
| Knowledge Chat | Consult shared laboratory knowledge with explicit sources. |
| AI Analysis | Interpret selected measurement and result data. |
| Controlled Agents | Propose bounded multi-step workflow actions. |

## Knowledge Chat

The static RAG demo searches manuals, protocols, procedures, papers, technical sheets, shared notes, Lab Cabinet resources, experiments, approved reports and NOMAD documentation.

Every answer is marked as simulated and to verify. It includes sources, provenance, evidence, related records, limitations and conflict or insufficiency warnings. Contextual actions require confirmation.

## AI Analysis

Analysis receives explicit experiment, stack, file, column, measure and filter context. Outputs show assumptions, evidence, confidence, limitations and review state.

## Controlled Agents

Agent runs expose objective, allowed inputs and actions, blocked actions, steps, proposals and approval gates. They cannot autonomously delete, publish or send requests.

No real LLM, retrieval index, embedding, vector store or agent runtime exists in this repository.
</script>

<script id="doc-readme" type="text/markdown">
# Technical POC

## Runtime

LabFlow is plain HTML, CSS and JavaScript with no build step or CDN. Serve the repository root with:

```text
python3 -m http.server 8765
```

Open `http://127.0.0.1:8765/`.

## Shared files

- `assets/theme.css`: theme tokens;
- `assets/app.css`: layout and product components;
- `assets/app.js`: shell, demo stores and interactions;
- `assets/exporters.js`: browser-generated outputs;
- `ui-kit.html`: canonical visual components;
- `docs/`: maintained product and technical reference.

## Security and integration limits

The visible user/workspace scope is not authorization. API keys must never be shipped in static JavaScript. A production implementation requires a secure backend for authentication, permissions, persistence, files, audit history, external APIs and secrets.

NOMAD import/upload, AI, RAG, agent execution and shared knowledge persistence are simulations. Browser-generated downloads are local POC artefacts and not a guarantee of scientific or NOMAD completeness.
