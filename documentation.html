    <script id="doc-overview" type="text/markdown">
# What is LabFlow?

LabFlow is an AI-ready laboratory workflow platform concept. It helps researchers document an experiment while doing the work, produce structured and reusable evidence, and prepare interoperable outputs without starting from repository forms.

> This repository is a static proof of concept for validating workflow, scientific usability, data relationships, AI integration and NOMAD preparation with real laboratory users.

## The platform in one map

```graph
direction LR
User[Researcher] --> Workspace[Workspace]
Workspace --> Cabinet[Lab Cabinet]
Workspace --> Experiment[Experiment]
Cabinet --> Experiment : resources
Experiment --> Workflow[Scientific workflow]
Workflow --> Report[Report]
Report --> Export[Export]
Export --> NOMAD[NOMAD]
```

## Design principles

| Principle | What it changes |
|---|---|
| Workflow-first | The interface follows laboratory work rather than repository structure. |
| Researcher-first | Familiar scientific language appears before implementation terms. |
| Progressive complexity | Advanced planning appears only when the researcher needs it. |
| Reusable resources | Shared definitions reduce repeated entry. |
| Provenance | Results remain connected to processing, measurements and files. |
| Human-in-the-loop AI | Suggestions show evidence and require review. |
| NOMAD interoperability | Readiness is collected progressively and validated explicitly. |

## Start here

Open the Workspace. Choose **New experiment**, **Continue your work** or **Import**. Projects are optional organisational containers, not a prerequisite.

### Demo scenario

Perovskite Research Lab uses experiment `PSC-2026-041`, solution `FA–Cs 1.2 M` / `SOL-081`, stacks `S01` and `S02`, Spin Coater 01 and protocol PSC n-i-p standard v4.1.

    <script id="doc-workflow" type="text/markdown">
# Researcher workflow

`Solutions → Stacks → Processing → Data → Analysis → Charts & Report → Export → NOMAD`

The sequence is recommended and non-blocking. Save a draft, skip optional work or revisit a phase.

| Phase | Researcher task | Record produced |
|---|---|---|
| 1 · Solutions | Define solvents, solutes, additives and preparation | Recipe + physical batch |
| 2 · Stacks | Order layers and connect materials | One or more experiment stacks |
| 3 · Processing | Perform and record laboratory actions | Processing run + actual values |
| 4 · Data | Upload, enter manually or import | Files, tables and measurement context |
| 5 · Analysis | Compare stacks and inspect anomalies | Reviewable findings |
| 6 · Charts & Report | Save visualisations and scientific narrative | Editable report |
| 7 · Export | Review scope, exclusions and formats | Local package |
| 8 · NOMAD | Resolve readiness issues and choose a path | NOMAD package or simulated API request |

## Creating an experiment

The creation wizard asks for name and goal, then solutions, then stacks. Conditions, replicates, automatic sample IDs and AI suggestions appear only after adding another stack.

## Processing is not a protocol

A **protocol** is the reusable ordered definition. **Processing** records what actually happened: operator, time, instrument, parameters, deviations and evidence. An **action** is one operation inside that run.

# Workspace, projects and Lab Cabinet

## Workspace

The Workspace is the researcher’s operating context. It contains experiments, shared Lab Cabinet resources, knowledge, reports and settings. The static POC displays ownership context but does not enforce real permissions.

## Projects

A Project optionally groups related experiments under one research goal. Researchers can start an experiment without creating a project first.

## Lab Cabinet

```graph
direction TB
Workspace[Workspace] --> Cabinet[Lab Cabinet]
Cabinet --> Materials[Materials & substances]
Cabinet --> Solutions[Solutions]
Cabinet --> Equipment[Equipment]
Cabinet --> Stacks[Stack templates]
Cabinet --> Protocols[Protocols]
Cabinet --> Conditions[Conditions & actions]
```

The Lab Cabinet is search-first. Search for the resource you need, inspect its status and provenance, then link it to the experiment. Lab Cabinet resources are shared definitions; concrete use belongs to the experiment.

### Example

`FA–Cs 1.2 M` is a reusable recipe. `SOL-081` is the physical solution batch prepared for `PSC-2026-041`.
    </script>

    <script id="doc-records" type="text/markdown">
# Scientific records

## Reusable versus experiment-owned

| Lab Cabinet definition | Concrete experiment record |
|---|---|
| Solution recipe | Prepared solution batch |
| Stack template | Experiment stack |
| Protocol | Processing run |
| Reusable action | Executed action |
| Instrument | Instrument use and actual settings |
| Material or substance | Lot or recorded use |

## Evidence chain

```graph
direction LR
Workspace[Workspace] --> Experiment[Experiment]
Experiment --> Stack[Stack]
Stack --> Processing[Processing]
Processing --> Data[Data & measurements]
Data --> Results[Results]
Results --> Report[Report]
Report --> Export[Export]
```

A usage snapshot preserves the selected definition version, affected stacks, amounts, actual parameters, operator and time. Later Lab Cabinet edits must not silently change historical evidence.

## Stack

A stack is an ordered material structure inside an experiment. It links layers, roles, materials, substrate, solution usage, conditions and samples. `S01` and `S02` are the two demo stacks.

## Data, results and reports

Original files remain evidence. Measurements add acquisition context. Results identify source files, method/version, unit and validation state. Reports select and explain those records without turning unexplained copied values into truth.
    </script>

    <script id="doc-ai" type="text/markdown">
# AI and shared knowledge

LabFlow separates three purposes.

| Surface | Purpose | Researcher control |
|---|---|---|
| Knowledge Assistant | Find and verify shared information | Inspect sources, conflicts and insufficiency warnings |
| AI Analysis | Analyse selected experimental data | Review assumptions, evidence and limitations |
| AI Agents | Execute guided multi-step proposals | Approve each selected action |

```graph
direction LR
Knowledge[Knowledge Assistant] --> Review[Researcher review]
Analysis[AI Analysis] --> Review
Agents[AI Agents] --> Review
Review --> Decision[Accept, edit or reject]
```

## Knowledge Assistant

The static RAG demonstration searches manuals, protocols, papers, technical sheets, shared notes, Lab Cabinet resources, experiments, approved reports and NOMAD documentation. Answers remain linked to numbered sources and never appear as unverified truth.

## AI Analysis

AI Analysis works from explicit experiment, stack, file, column and measure context. It shows findings, anomalies, assumptions, confidence and limitations while leaving original measurements unchanged.

## AI Agents

Agents represent bounded workflows. They expose their objective, allowed inputs, blocked actions, steps and approval gates. The POC cannot autonomously delete, publish or send an API request.
    </script>

    <script id="doc-nomad" type="text/markdown">
# Reports, export and NOMAD

```graph
direction LR
Evidence[Experiment evidence] --> Report[Editable report]
Report --> Export[Export review]
Export --> Prepare[Prepare NOMAD]
Prepare --> Package[NOMAD package]
Prepare --> API[Simulated API send]
```

## Report

Build the scientific story from experiment records, saved charts, files and provenance. AI-assisted narrative remains an editable draft.

## Export

Generate represented formats including CSV, Excel, JSON, JSONL, YAML, images, PDF, ZIP and a full experiment archive. Before generation, inspect scope, included and excluded records, warnings and version.

## NOMAD

NOMAD is the final explicit phase. Readiness checks cover completeness, units, resources, stacks, processing, instruments, files, identifiers, provenance and mappings.

Choose one path:

1. Generate and inspect a local NOMAD package.
2. Simulate an explicit submission through the user’s NOMAD API connection.

Import from NOMAD remains a separate preview-and-map workflow. The static POC never transmits credentials or data.
    </script>

    <script id="doc-interface" type="text/markdown">
# Interface guide

## Search

The top search uses one shared component. It filters visible page records when available and suggests relevant destinations across experiments, Lab Cabinet resources, reports, tools, settings, results and documentation.

## States and actions

- One primary action communicates the current next step.
- Badges always include text; colour is supplementary.
- Advanced scientific fields use expandable sections.
- Destructive or contextual actions require confirmation.
- Empty states explain the next useful action.
- Tables remain inside horizontal scrollers.

## Responsive behaviour

The design supports 360–1440 px. Below 980 px the sidebar becomes a drawer. Workflow rails scroll horizontally, grids collapse and modals use internal scrolling without hiding primary actions.

## Accessibility baseline

Pages include a skip link, semantic controls, keyboard focus, labelled icon buttons and reduced-motion support. This POC still requires a complete production accessibility audit.
    </script>

    <script id="doc-poc" type="text/markdown">
# Why this repository is a static POC

The static architecture is a deliberate validation step, not an unfinished backend.

## What it validates

- researcher workflow and information hierarchy;
- progressive disclosure and scientific usability;
- reusable versus concrete data relationships;
- provenance and export review;
- credible AI boundaries;
- NOMAD preparation as a natural final phase.

## What is not implemented

| Not present | Production responsibility |
|---|---|
| Backend or database | Durable records, transactions and APIs |
| Authentication or authorization | Identity, permissions and workspace isolation |
| File storage | Integrity, retention and access control |
| Real AI or RAG | Models, retrieval, evaluation and audit |
| Real agent runtime | Secure tools and persisted approvals |
| Real NOMAD connection | Secret handling, network requests and retries |

## Runtime

LabFlow uses plain HTML, CSS and JavaScript without a framework, build step or CDN. Serve the repository root with `python3 -m http.server 8765` or publish it on GitHub Pages.

Never enter real API keys or sensitive laboratory data in this POC.
