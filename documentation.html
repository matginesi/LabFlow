# What is LabFlow?

LabFlow is a Project-centred laboratory workspace concept. It helps researchers capture experimental context while doing the work, connect evidence to analysis, and prepare interoperable outputs without starting from repository forms.

> This repository is a static proof of concept for validating workflow, scientific usability, data relationships, AI integration and NOMAD preparation with real laboratory users.

It is also an inspectable implementation demonstration: plain local HTML, CSS and JavaScript; no backend, CDN, tracker or cookie; and no durable scientific data.

## The platform in one map

```graph
direction LR
User[Researcher] --> Workspace[Workspace]
Workspace --> Project[Project]
Project --> Pipeline[Pipeline]
Pipeline --> Steps[Revisitable steps]
Workspace --> Cabinet[Lab Cabinet]
Cabinet --> Project : snapshots
Steps --> Evidence[Scientific evidence]
Evidence --> Report[Report]
Report --> Export[Export]
Export --> NOMAD[NOMAD]
```

## Design principles

| Principle | What it changes |
|---|---|
| Workflow-first | The interface follows laboratory work rather than repository structure. |
| Researcher-first | Familiar scientific language appears before implementation terms. |
| Progressive Data Capture | Ask only for essential information now; reveal recommended or advanced context when it becomes useful. |
| Reusable resources | Shared definitions reduce repeated entry. |
| Provenance | Results remain connected to processing, measurements and files. |
| Human-in-the-loop AI | Suggestions show evidence and require review. |
| NOMAD interoperability | Readiness is collected progressively and validated explicitly. |

## Start here

Open the Dashboard and continue a **Project**, or create one and select a **Pipeline**. CHOSE provides five connected research steps; Quick Experiment provides three independent steps. The Project remembers progress only for the current browser-tab session.

## Who it is for and how success is judged

Researchers use the flow; PIs review evidence; lab managers evaluate reusable definitions and future policy; developers inspect the production direction. The POC succeeds when a reviewer can understand `Workspace → Project → Pipeline → Step`, ingest and connect heterogeneous evidence, distinguish real behavior from simulation, and verify the privacy boundary without implementation guidance.

### Demo scenario

Perovskite Research Lab uses experiment `PSC-2026-041`, solution `FA–Cs 1.2 M` / `SOL-081`, stacks `S01` and `S02`, Spin Coater 01 and protocol PSC n-i-p standard v4.1.

    <script id="doc-workflow" type="text/markdown">
# Researcher workflow

`Materials & Solutions → Stack & Fabrication → Data Ingest → Analysis → Report & Export`

The sequence is recommended and non-blocking. Save a draft, skip optional work or revisit a phase.

| Phase | Researcher task | Record produced |
|---|---|---|
| 1 · Materials & Solutions | Define or reuse recipes and material context | Structured definitions + Project snapshots |
| 2 · Stack & Fabrication | Build variants, samples and actual processing context | Stacks + fabrication evidence |
| 3 · Data Ingest | Choose or detect JV, Dark JV, IPCE, UV/VIS or Stability; preview, map and validate the source | Typed Measurements + provenance metadata |
| 4 · Analysis | Compare conditions and record conclusions | Traceable comparisons + findings |
| 5 · Report & Export | Select evidence, inspect readiness and generate locally | Report + CSV/JSON + NOMAD-ready view |

## Creating a Project

The creation wizard asks for Project identity and Pipeline. CHOSE opens at Materials & Solutions and keeps all five steps revisitable. Quick uses Plan, Record and Share with its own data shape. Detailed Experiment records remain compatibility views for execution-level concepts.

## Measurement-first ingest

The scientific meaning comes before the file extension. LabFlow treats **Measurement Type** and **File Format** as separate concepts: a JV can arrive as CSV, TXT or DAT; a UV/VIS spectrum can arrive as generic XY text. The POC gives first-class treatment to **JV, Dark JV, IPCE, UV/VIS and Stability**, plus generic evidence. Deterministic rules use filenames, headers, units and table structure to suggest a type, and the researcher can always correct the suggestion.

The visible ingest flow is `Add data → Detect → Preview → Map → Validate → Attach`. CSV, TSV, TXT, DAT and common XY text are the strongest local parsing path. JSON-family, XML and simple YAML can be inspected when their structure is suitable. Complex spreadsheets, scientific containers, documents, images, archives and binary instrument formats remain honestly labelled as **Structure inspected**, **Metadata only** or **Raw evidence** instead of pretending they were parsed. No file is uploaded or durably stored.

## Progressive Data Capture

Fields are treated as **Required**, **Recommended** or **Advanced**. LabFlow reuses context that is already available and distinguishes values that are **user-entered, imported, inherited, inferred or calculated**. Missing recommended metadata does not block the workflow: it appears later as a contextual improvement when it becomes useful for comparison, reproducibility, provenance or NOMAD readiness.

## Processing is not a protocol

A **protocol** is the reusable ordered definition. **Processing** records what actually happened: operator, time, instrument, parameters, deviations and evidence. An **action** is one operation inside that run.

    <script id="doc-cabinet" type="text/markdown">
# Workspace, Projects, Pipelines and Lab Cabinet

## Workspace

The Workspace is the researcher’s operating context. Its central hierarchy is `Workspace → Project → Pipeline → Steps`. It also contains generic Lab Cabinet, knowledge, AI and scientific tools. The static POC keeps Project and step state only in `sessionStorage` and does not enforce real permissions.

## Pipelines

A Pipeline is the workflow definition selected by a Project. In a production model it would be versioned and declare expected evidence, measurements and mappings. Process and Experiment remain compatibility/domain concepts, not primary navigation roots.

## Projects

A Project is the primary, session-scoped unit of work. CHOSE guides Materials & Solutions, Stack & Fabrication, Data Ingest, Analysis, and Report & Export including NOMAD. Earlier steps always remain revisitable.

## Lab Cabinet

```graph
direction TB
Workspace[Workspace] --> Cabinet[Lab Cabinet]
Cabinet --> Materials[Materials & substances]
Cabinet --> Solutions[Solutions]
Cabinet --> Equipment[Equipment]
Cabinet --> Stacks[Stack templates]
Cabinet --> Protocols[Protocols]
Cabinet --> Conditions[Conditions & actions]
```

The Lab Cabinet is search-first. Search for the resource you need, inspect its status and provenance, then link it to the experiment. Lab Cabinet resources are shared definitions; concrete use belongs to the experiment.

### Example

`FA–Cs 1.2 M` is a reusable recipe. `SOL-081` is the physical solution batch prepared for `PSC-2026-041`.
    </script>

    <script id="doc-records" type="text/markdown">
# Scientific records

## Reusable versus experiment-owned

A **Dataset** is the data itself. A **Measurement** is the scientific meaning attached to those data: type, target, conditions, source, provenance and any derived metrics. This lets the interface show `JV · Sample S03-A` instead of reducing the experiment to filenames.

| Lab Cabinet definition | Concrete experiment record |
|---|---|
| Solution recipe | Prepared solution batch |
| Stack template | Experiment stack |
| Protocol | Processing run |
| Reusable action | Executed action |
| Instrument | Instrument use and actual settings |
| Material or substance | Lot or recorded use |

## Evidence chain

```graph
direction LR
Workspace[Workspace] --> Process[Process definition]
Process --> Experiment[Experiment]
Experiment --> Step[Experiment steps]
Step --> Stack[Stacks & samples]
Stack --> Processing[Processing]
Processing --> Data[Data & measurements]
Data --> Results[Results]
Results --> Report[Report]
Report --> Export[Export]
```

A usage snapshot preserves the selected definition version, affected stacks, amounts, actual parameters, operator and time. Later Lab Cabinet edits must not silently change historical evidence.

## Stack

A Stack Template is a reusable ordered material definition. An Experiment Stack is its versioned snapshot or a newly built variant inside one experiment. Each layer records role, material, thickness, source definition or batch and creation/deposition method. Physical Samples receive stable IDs and remain linked to the exact stack variant and processing history. `S01` and `S02` are the two demo experiment stacks.

## Data, results and reports

Original files remain evidence. Measurements add acquisition context. Results identify source files, method/version, unit and validation state. Reports select and explain those records without turning unexplained copied values into truth.

    <script id="doc-ai" type="text/markdown">
# AI and shared knowledge

LabFlow separates three purposes.

| Surface | Purpose | Researcher control |
|---|---|---|
| Knowledge Assistant | Find and verify shared information | Inspect sources, conflicts and insufficiency warnings |
| AI Analysis | Analyse selected experimental data | Review assumptions, evidence and limitations |
| AI Agents | Execute guided multi-step proposals | Approve each selected action |

```graph
direction LR
Knowledge[Knowledge Assistant] --> Review[Researcher review]
Analysis[AI Analysis] --> Review
Agents[AI Agents] --> Review
Review --> Decision[Accept, edit or reject]
```

## Knowledge Assistant

The static RAG demonstration searches manuals, protocols, papers, technical sheets, shared notes, Lab Cabinet resources, experiments, approved reports and NOMAD documentation. Answers remain linked to numbered sources and never appear as unverified truth.

## AI Analysis

AI Analysis works from explicit experiment, stack, file, column and measure context. It shows findings, anomalies, assumptions, confidence and limitations while leaving original measurements unchanged.

## AI Agents

Agents represent bounded workflows. They expose their objective, allowed inputs, blocked actions, steps and approval gates. The POC cannot autonomously delete, publish or send an API request.
    </script>

    <script id="doc-nomad" type="text/markdown">
# Reports, export and NOMAD

```graph
direction LR
Evidence[Experiment evidence] --> Report[Editable report]
Report --> Export[Export review]
Export --> Prepare[Prepare NOMAD]
Prepare --> Package[NOMAD package]
Prepare --> API[Simulated API send]
```

## Report

Build the scientific story from experiment records, saved charts, files and provenance. AI-assisted narrative remains an editable draft.

## Export

The broad export centre represents CSV, Excel, JSON/JSONL, YAML, images, PDF, ZIP and archive paths. The implemented CHOSE step generates local JSON and CSV and supports print-to-report. Labels distinguish real local generation from represented or simulated formats.

## NOMAD

NOMAD is the final explicit phase. Readiness checks cover completeness, units, resources, stacks, processing, instruments, files, identifiers, provenance and mappings.

Choose one path:

1. Generate and inspect a local NOMAD package.
2. Simulate an explicit submission through the user’s NOMAD API connection.

Import from NOMAD remains a separate preview-and-map workflow. The static POC never transmits credentials or data.
    </script>

    <script id="doc-interface" type="text/markdown">
# Interface guide

## Search

The top search uses one shared component. It filters visible page records when available and suggests relevant destinations across experiments, Lab Cabinet resources, reports, tools, settings, results and documentation.

## States and actions

- One primary action communicates the current next step.
- Badges always include text; colour is supplementary.
- Advanced scientific fields use expandable sections.
- Destructive or contextual actions require confirmation.
- Empty states explain the next useful action.
- Tables remain inside horizontal scrollers.

## Canonical page grammar

Every route reuses the same shell, 1480 px outer frame, tokenised page padding, header, breadcrumb, panels, forms, tables, toolbars, buttons and responsive breakpoints. Nested records show their breadcrumb before the page header; top-level Workspace destinations begin directly with the header. Feature pages keep their own scientific visualisations inside these shared boundaries. `ui-kit.html` is the rendered component reference, `docs/DESIGN_SYSTEM.md` defines ownership and `docs/UI_STANDARDS.md` defines page/layout rules.

## Responsive behaviour

The design supports 360–1440 px. Below 980 px the sidebar becomes a drawer. Workflow rails scroll horizontally, grids collapse and modals use internal scrolling without hiding primary actions.

## Accessibility baseline

Pages include a skip link, semantic controls, keyboard focus, labelled icon buttons and reduced-motion support. This POC still requires a complete production accessibility audit.
    </script>

    <script id="doc-poc" type="text/markdown">
# Why this repository is a static POC

The static architecture is a deliberate validation instrument, not an implied production backend.

## What it validates

- researcher workflow and information hierarchy;
- progressive disclosure and scientific usability;
- reusable versus concrete data relationships;
- provenance and export review;
- credible AI boundaries;
- NOMAD preparation as a natural final phase.

## What is not implemented

| Not present | Production responsibility |
|---|---|
| Backend or database | Durable records, transactions and APIs |
| Authentication or authorization | Identity, permissions and workspace isolation |
| File storage | Integrity, retention and access control |
| Real AI or RAG | Models, retrieval, evaluation and audit |
| Real agent runtime | Secure tools and persisted approvals |
| Real NOMAD connection | Secret handling, network requests and retries |
| Production parsers for every recognised format | Sandboxed workers, validation and parser provenance |

## Runtime

LabFlow uses plain HTML, CSS and JavaScript without a framework, build step or CDN. Scientific state is temporary `sessionStorage`; the first load of every new browser-tab session clears saved scientific records, while navigation and reloads inside that tab retain current work. Static empty Project shells are interface fixtures, not saved evidence. Only appearance/account-display preferences may use `localStorage`. It creates no cookies, includes no trackers and sends no files or telemetry. It is intended for direct static publication on GitHub Pages. Pipeline YAML and step fragments are compiled into a generated browser bundle, so the runtime does not need `fetch()` or a local launcher.

Never enter real API keys or sensitive laboratory data in this POC.
