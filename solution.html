<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.dataset.theme=localStorage.getItem("labflow-theme")||"light"</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Solution detail">
  <title>Solution · LabFlow</title>
  <link href="assets/theme.css" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/app.css">
  <script defer src="assets/exporters.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body data-page="solution-detail">
  <header id="topbar" class="topbar"></header>
  <aside id="sidebar" class="sidebar"></aside>
  <button class="sidebar-overlay" type="button" data-action="close-sidebar" aria-label="Close navigation"></button>

  <div class="app-main">
    <main class="page solution-page">
      <header class="page-header">
        <div>
          <span class="eyebrow">Solution <span class="mono" id="solutionId">SOL-001</span></span>
          <h1 id="solutionName">FA0.85Cs0.15PbI3 Precursor</h1>
          <p id="solutionDescription">Perovskite absorber precursor solution</p>
        </div>
        <div class="page-actions">
          <button class="button" type="button" data-action="edit-solution"><span data-icon="code"></span>Edit</button>
        </div>
      </header>

      <article class="solution-recipe-card solution-detail-recipe" id="solutionDiagram">
        <header><div><span class="eyebrow">Reusable recipe</span><h3 id="solutionOutputLabel">FA0.85Cs0.15PbI3 1.5 M</h3></div><span class="badge success">Ready</span></header>
        <div class="recipe-composition">
          <section class="recipe-solvent"><span class="recipe-label">Solvent mixture · 5 mL</span><div class="solvent-mixture"><span class="dmf" style="--ratio:80%"><b>DMF</b><small>80% · 4 mL</small></span><span class="dmso" style="--ratio:20%"><b>DMSO</b><small>20% · 1 mL</small></span></div></section>
          <span class="recipe-plus" aria-hidden="true">+</span>
          <section class="recipe-ingredients"><span class="recipe-label">Solutes</span><div id="solutionInputs"></div></section>
        </div>
        <footer><div><small>Concentration</small><strong>1.5 M</strong></div><div><small>Solvent ratio</small><strong>4:1 v/v</strong></div><div><small>Total volume</small><strong>5 mL</strong></div></footer>
      </article>

      <div class="split">
        <div class="panel">
          <div class="panel-header">            <div class="panel-title"><strong>Precursors</strong></div></div>
          <div class="panel-body">
            <table class="data-table" id="solutionPrecursors">
            </table>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header">            <div class="panel-title"><strong>Solvents</strong></div></div>
          <div class="panel-body">
            <table class="data-table" id="solutionSolvents">
            </table>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">            <div class="panel-title"><strong>Properties</strong></div></div>
        <div class="panel-body">
          <div class="grid-3" id="solutionProperties">
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
</body>
</html>
