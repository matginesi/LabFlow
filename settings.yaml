# LabFlow configuration
#
# This is the canonical, human-editable source. YAML comments are supported.
# After changing it, refresh the checked-in static browser bundle.

application:
  id: labflow-static-poc
  name: LabFlow
  description: Static research workspace for structured laboratory projects
  deployment: github-pages
  runtime: vanilla-html-css-javascript

appearance:
  # Content may be light or dark; the application shell always stays dark.
  # Both this theme and the selected palette tint the sidebar and topbar.
  default_theme: light
  default_palette: blue
  default_density: compact
  shell_theme: dark

demo_user:
  name: Matteo Ginesi
  role: Perovskite Researcher
  email: matteo.ginesi@lab.example
  organisation: University of Rome Tor Vergata
  laboratory: CHOSE — Centre for Hybrid and Organic Solar Energy
  workspace: Advanced Photovoltaics

demo_administration:
  allow_user_theme: true
  require_evidence_for_ai: true
  show_working_knowledge: true

pipelines:
  enabled:
    - chose
    - quick
  default: chose

features:
  global_search: true
  knowledge_base: true
  generic_tools: true
  ai_assistance: true
  nomad_preview: true

reports:
  author: Matteo Ginesi
  laboratory: CHOSE — Centre for Hybrid and Organic Solar Energy
  organisation: University of Rome Tor Vergata
  default_export: bundle
  approval_required: true

exports:
  enabled:
    - pdf
    - docx
    - xlsx
    - bundle
  workbook_sheets:
    - Dashboard
    - Project
    - Solutions
    - Stack
    - Raw Data
    - Processed Data
    - Analysis
    - AI Findings
    - Provenance
    - Export Manifest

nomad:
  mode: demonstration
  upload_enabled: false
  credentials_allowed: false

ai:
  mode: deterministic-local-demonstration
  enabled: true
  human_approval_required: true
  external_provider: false

knowledge:
  default_scope: approved
  include_provenance: true
  automatic_writes: false

# These flags define the privacy boundary of the static proof of concept.
feature_flags:
  authentication: false
  browser_persistence: false
  external_requests: false
  tracking: false
  pwa: false
