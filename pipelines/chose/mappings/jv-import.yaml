schema_version: labflow.mapping.v1
id: chose-jv-measurements
label: CHOSE Keithley JV CSV
measurement_type: jv_curve
accepted_sources: [csv, tsv, xlsx, txt, json]
preserve_source_columns: true
require_unit_confirmation: true
allow_silent_conversion: false
required_links:
  - experiment_id
  - sample_id
optional_links:
  - device_id
  - measurement_run_id
fields:
  - source: Sample_ID
    target: device.identifier
    source_unit: text
    target_unit: text
    conversion: none
    confidence: 99
    preview: S08
    decision: confirmed
  - source: Voc
    target: measurements.jv.open_circuit_voltage
    source_unit: V
    target_unit: V
    conversion: none
    confidence: 98
    preview: 1.13 V
    decision: confirmed
  - source: Jsc
    target: measurements.jv.short_circuit_current_density
    source_unit: mA/cm2
    target_unit: A/m2
    conversion: multiply_10
    confidence: 94
    preview: 234 A/m2
    decision: review
  - source: FF
    target: measurements.jv.fill_factor
    source_unit: '%'
    target_unit: '%'
    conversion: none
    confidence: 97
    preview: 80.5%
    decision: confirmed
  - source: PCE
    target: measurements.jv.efficiency
    source_unit: '%'
    target_unit: '%'
    conversion: none
    confidence: 99
    preview: 21.28%
    decision: confirmed
  - source: ScanDir
    target: measurements.jv.scan_direction
    source_unit: enum
    target_unit: enum
    conversion: FWD_to_forward
    confidence: 91
    preview: forward
    decision: review
quality_checks:
  - missing_identifiers
  - invalid_units
  - duplicate_records
  - orphan_samples
  - device_count_mismatch
  - incomplete_provenance
