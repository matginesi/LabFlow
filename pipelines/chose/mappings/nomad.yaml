schema_version: labflow.mapping.v1
id: chose-perovskite-v1
label: CHOSE perovskite NOMAD preview
mode: readiness_preview
remote_submission: false
required_entities:
  - project
  - process_version
  - experiment
  - sample
  - result_set
  - measurement
required_fields:
  project:
    - id
    - name
  process_version:
    - process_id
    - version
    - stack_definition
  experiment:
    - experiment_id
    - process_snapshot
    - operator
  sample:
    - sample_id
    - experiment_id
  measurement:
    - sample_id
    - quantity
    - value
    - unit
provenance:
  require_source_manifest: true
  require_process_snapshot: true
  preserve_open_issues: true
