schema_version: labflow.demo.v1
process:
  process_id: PROC-CHOSE-014
  version: 2
  name: CHOSE Standard v2
  status: review
  stable_label: PROC-CHOSE-014/v2
solution_definitions:
- id: SOL-011
  version: 3
  name: FA/MA 1.25 M reference
  type: perovskite precursor
  status: reviewed
  solvent_ratio: DMF:DMSO 4:1
  reference_volume:
    value: 2.0
    unit: mL
  target_concentration:
    value: 1.25
    unit: mol/L
  preparation_handling: Prepare in N2 glovebox; keep away from moisture; filter with 0.22 um PTFE.
  before_use_handling: Stir at 60 degC for 1 h and allow to cool before coating.
  state: Homogeneous precursor
  components:
  - name: DMF
    role: Primary solvent
    amount: 1.60 mL
    share: 80% v/v
    tone: dmf
    phase: solvent
  - name: DMSO
    role: Co-solvent
    amount: 0.40 mL
    share: 20% v/v
    tone: dmso
    phase: solvent
  - name: FAI
    role: A-site solute
    amount: 365.3 mg
    share: 90 mol%
    tone: fai
    phase: solute
  - name: MAI
    role: A-site solute
    amount: 39.7 mg
    share: 10 mol%
    tone: mai
    phase: solute
  - name: PbI2
    role: Lead halide
    amount: 1152.5 mg
    share: 1.00 eq
    tone: pbi
    phase: solute
  checks:
  - label: Formula balanced
    state: valid
  - label: Units explicit
    state: valid
  - label: Handling metadata incomplete
    state: warning
- id: SOL-021
  version: 2
  name: SnO2 diluted 1:5
  type: n-type (ETL)
  status: reviewed
  solvent_ratio: DI water
  summary: DI water · reviewed
- id: SOL-017
  version: 2
  name: Spiro-OMeTAD standard
  type: p-type (HTL)
  status: draft
  solvent_ratio: Chlorobenzene
  summary: Chlorobenzene · draft
substrate:
  id: SUB-ITO-01
  version: 2
  name: ITO glass substrate
  material: Glass / ITO
  alternatives:
  - Glass / FTO
  - Flexible ITO / PET
  rigidity: Rigid
  rigidity_options:
  - Rigid
  - Flexible
  roughness_rms:
    value: 1
    unit: nm
  dimensions:
    length:
      value: 2
      unit: cm
    width:
      value: 2
      unit: cm
    thickness:
      value: 1
      unit: mm
fabrication_operations:
- id: OP-01
  type: rinsing
  label: Rinsing / washing
  material: IPA · DI water
  planned: 3 cycles
  target: 10 min
  required: true
  capability: wet_bench
- id: OP-02
  type: sonication
  label: Sonication
  material: IPA
  planned: 40 kHz
  target: 10 min
  required: true
  capability: sonicator
- id: OP-03
  type: uv_ozone
  label: UV/Ozone
  material: none
  planned: Ambient
  target: 15 min
  required: true
  capability: uv_ozone_cleaner
- id: OP-04
  type: spin_coating
  label: Spin coating
  material: SOL-021 · SnO2
  planned: 4000 rpm
  target: 30 s
  required: true
  capability: spin_coater
  produces_layer: L02
- id: OP-05
  type: annealing
  label: Annealing
  material: none
  planned: 100 degC
  target: 30 min
  required: true
  capability: hotplate
- id: OP-06
  type: spin_coating
  label: Spin coating
  material: SOL-011 · precursor
  planned: 4000 rpm
  target: 30 s
  required: true
  capability: spin_coater
  produces_layer: L03
- id: OP-07
  type: evaporation
  label: Evaporation
  material: Au
  planned: 2e-6 mbar
  target: 80 nm
  required: true
  capability: thermal_evaporator
  produces_layer: L05
stack:
  id: STK-003
  version: 2
  architecture: n-i-p
  layers:
  - id: L01
    material: Glass / FTO
    thickness: 2.2 mm
    function: Substrate + front contact
    process: Cleaning
    tone: substrate
    producer: substrate
  - id: L02
    material: SnO2
    thickness: 32 nm
    function: Electron transport
    process: Spin coat
    tone: etl
    producer: OP-04
  - id: L03
    material: FA/MA perovskite
    thickness: 540 nm
    function: Photoactive absorber
    process: Anti-solvent
    tone: absorber
    producer: OP-06
  - id: L04
    material: Spiro-OMeTAD
    thickness: 180 nm
    function: Hole transport
    process: Spin coat
    tone: htl
    producer: process_variant
  - id: L05
    material: Au
    thickness: 80 nm
    function: Back contact
    process: Evaporation
    tone: contact
    producer: OP-07
validation:
  summary:
    errors: 0
    warnings: 0
  checks:
  - state: success
    title: Operation order is coherent
    detail: Substrate preparation precedes coating; transport and contact layers have producers.
  - state: success
    title: Equipment capabilities are declared
    detail: Required capability categories are explicit; concrete equipment is assigned during Experiment execution.
  rule_results:
    explicit-units:
      status: pass
      detail: Reference volumes, concentrations, substrate geometry and stack thicknesses declare units.
    ordered-operations:
      status: pass
      detail: Seven uniquely identified fabrication operations are stored in order.
    producer-before-consumer:
      status: pass
      detail: Every stack layer references a fabrication producer or an explicit external producer.
    equipment-capabilities:
      status: pass
      detail: Every required operation declares a required equipment capability category.
