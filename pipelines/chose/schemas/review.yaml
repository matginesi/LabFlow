schema_version: labflow.record-schema.v1
record_type: scientific_review
label: CHOSE scientific review document
record_path: review
stable_id_field: review_id

document:
  required:
    - review
    - findings
    - overview
    - comparison
    - report
    - provenance_manifest
    - export_manifest

fields:
  review_id:
    type: string
    required: true
    pattern: '^REV-[A-Z0-9-]+$'
  experiment_id:
    type: relation
    relation: experiment
    required: true
  result_set_id:
    type: relation
    relation: result_set
    required: true
  status:
    type: enum
    required: true
    values: [draft, needs_revision, approved]
  approval_state:
    type: string
    required: true
  researcher_conclusion:
    type: object
    required: true

collections:
  findings:
    type: object_list
    required: true
    minimum_items: 1
    stable_id_field: finding_id
  provenance_manifest:
    type: object_list
    required: true
    minimum_items: 1
  report.section_catalog:
    type: object_list
    required: true
    minimum_items: 1

finding_contract:
  allowed_types:
    - observation
    - calculation
    - correlation
    - hypothesis
    - validation_issue
    - ai_suggestion
    - researcher_conclusion
  required_fields:
    - finding_id
    - type
    - statement
    - evidence_refs
    - review_status
  review_status_values:
    - proposed
    - needs_revision
    - accepted
    - rejected

validation:
  - id: evidence-required
    validator: every_finding_has_evidence
    severity: error
  - id: ai-human-decision
    validator: ai_findings_have_human_review_status
    severity: error
  - id: source-derived-separation
    validator: provenance_classes_are_explicit
    severity: error
