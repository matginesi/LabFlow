schema_version: labflow.record-schema.v1
record_type: experiment
label: CHOSE experiment document
record_path: experiment
stable_id_field: experiment_id

document:
  required:
    - experiment
    - batches
    - samples
    - devices
    - execution_records

fields:
  experiment_id:
    type: string
    required: true
    pattern: '^EXP-[0-9]{3}$'
  name:
    type: string
    required: true
  process_snapshot:
    type: object
    required: true
    immutable: true
  operator:
    type: string
    required: true
  start_date:
    type: date
    required: true
  environment:
    type: object
    required: true

collections:
  batches:
    type: relation_list
    relation: solution_batch
    required: true
    minimum_items: 1
    stable_id_field: id
  samples:
    type: relation_list
    relation: sample
    required: true
    minimum_items: 1
    stable_id_field: id
  devices:
    type: relation_list
    relation: device
    required: true
    minimum_items: 1
    stable_id_field: id
  execution_records:
    type: ordered_list
    item_type: execution_record
    required: true
    minimum_items: 1
    stable_id_field: operation_id
  deviations:
    type: object_list
    required: false
    stable_id_field: id

execution_record:
  required_fields:
    - operation_id
    - planned
    - actual
    - execution_time
    - status
  optional_fields:
    - equipment
    - note

validation:
  - id: snapshot-hash
    validator: immutable_snapshot_has_hash
    severity: error
  - id: required-operations
    validator: required_operations_have_execution_records
    severity: error
  - id: deviation-visibility
    validator: changed_values_have_deviation_record
    severity: warning
